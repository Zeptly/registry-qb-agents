# Registry-of-registries map for stable ID kinds.
# Purely informational for humans and for the validator's kind allow-list.
# Artifacts are resolved by <id> + <semver range> through each registry's published
# index (see docs/cross-registry-references.md), never by repository path.
apiVersion: qb.zeptly.dev/v1
kind: RegistryMap
kinds:
  qb:              { registry: qb-agents,         repo: Zeptly/registry-qb-agents }
  execution-agent: { registry: execution-agents,  repo: Zeptly/registry-execution-agents }
  tiny-agent:      { registry: tiny-agents,       repo: Zeptly/registry-tiny-agents }
  skill:           { registry: skills,            repo: Zeptly/registry-skills }
  capability:      { registry: capabilities,      repo: null }   # provider/capability gateways; owner TBD
  gateway:         { registry: gateway-contracts, repo: null }   # abstract service contracts (AI Gateway, Cortex, ...)
  dataset:         { registry: evaluation-data,   repo: null }
  evalsuite:       { registry: qb-agents,         repo: Zeptly/registry-qb-agents }
